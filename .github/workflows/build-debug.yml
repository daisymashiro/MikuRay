name: Build Debug APK

# Trigger on pull requests and manual dispatch
on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'V2rayNG/**'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      # Step 2: Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      # Step 3: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # Step 4: Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      # Step 5: Install NDK
      - name: Install Android NDK
        run: |
          echo "Installing NDK 29.0.14206865..."
          sdkmanager "ndk;29.0.14206865"
      
      # Step 6: Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            V2rayNG/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # Step 7: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x V2rayNG/gradlew
      
      # Step 8: Build Debug APK
      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      
      # Step 9: Upload debug APKs as artifacts
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-Debug-APKs-${{ github.run_number }}
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
      
      # Step 10: Create build summary
      - name: Create build summary
        run: |
          echo "## 🔨 Debug Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $(grep 'appVersionName' V2rayNG/app/build.gradle.kts | cut -d'"' -f2)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cd V2rayNG/app/build/outputs/apk/debug
          ls -lh *.apk 2>/dev/null || echo "No APK files found"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
