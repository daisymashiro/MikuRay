name: Build Debug APK

# Trigger on pull requests and manual dispatch
on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'V2rayNG/**'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      # Step 2: Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      # Step 3: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # Step 4: Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      # Step 5: Install NDK
      - name: Install Android NDK
        run: |
          echo "Installing NDK 29.0.14206865..."
          sdkmanager "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
      
      # Step 6: Restore cached libhevtun
      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}
      
      # Step 7: Build libhevtun native library
      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh
      
      # Step 8: Save libhevtun cache
      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}
      
      # Step 9: Copy libhevtun to app/libs
      - name: Copy libhevtun
        run: |
          cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
      
      # Step 10: Fetch AndroidLibXrayLite tag
      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Current tag in this repo: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd
      
      # Step 11: Download libv2ray.aar
      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/
      
      # Step 12: Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            V2rayNG/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # Step 13: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x V2rayNG/gradlew
      
      # Step 14: Build Debug APK
      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      
      # Step 15: Upload debug APKs as separate artifacts by architecture
      # arm64-v8a: Modern Android devices (2020+, 64-bit ARM)
      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-arm64-v8a-debug
          path: V2rayNG/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 7
      
      # armeabi-v7a: Older Android devices (32-bit ARM)
      - name: Upload armeabi-v7a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-armeabi-v7a-debug
          path: V2rayNG/app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: warn
          retention-days: 7
      
      # x86_64: Android emulators, Intel/AMD devices (64-bit)
      - name: Upload x86_64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-x86_64-debug
          path: V2rayNG/app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: warn
          retention-days: 7
      
      # x86: Older emulators (32-bit)
      - name: Upload x86 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-x86-debug
          path: V2rayNG/app/build/outputs/apk/debug/*x86*.apk
          if-no-files-found: warn
          retention-days: 7
      
      # universal: All architectures (largest file)
      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-universal-debug
          path: V2rayNG/app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn
          retention-days: 7
      
      # Step 16: Create build summary
      - name: Create build summary
        run: |
          echo "## 🔨 Debug Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $(grep 'appVersionName' V2rayNG/app/build.gradle.kts | cut -d'"' -f2)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cd V2rayNG/app/build/outputs/apk/debug
          ls -lh *.apk 2>/dev/null || echo "No APK files found"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
