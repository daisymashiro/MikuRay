name: Build and Sign Release APK

# Trigger workflow on push to master branch or manual dispatch
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'V2rayNG/**'
      - '.github/workflows/build-release.yml'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 2.2.9)'
        required: false
        default: ''

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      # Step 2: Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      # Step 3: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # Step 4: Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      # Step 5: Install NDK (required for native code)
      - name: Install Android NDK
        run: |
          echo "Installing NDK 29.0.14206865..."
          sdkmanager "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
      
      # Step 6: Restore cached libhevtun
      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}
      
      # Step 7: Build libhevtun native library
      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: |
          bash compile-hevtun.sh
      
      # Step 8: Save libhevtun cache
      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}
      
      # Step 9: Copy libhevtun to app/libs
      - name: Copy libhevtun
        run: |
          cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
      
      # Step 10: Fetch AndroidLibXrayLite tag
      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Current tag in this repo: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd
      
      # Step 11: Download libv2ray.aar
      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/
      
      # Step 12: Cache Gradle dependencies (disabled temporarily for testing)
      # Uncomment when build is stable
      # - name: Cache Gradle dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #       V2rayNG/.gradle
      #     key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      #     restore-keys: |
      #       ${{ runner.os }}-gradle-
      
      # Step 13: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x V2rayNG/gradlew
      
      # Step 14: Clean build artifacts and cache
      - name: Clean build artifacts
        run: |
          cd V2rayNG
          rm -rf .gradle build app/build app/.cxx
          ./gradlew clean --no-daemon
      
      # Step 15: Build Release APK (unsigned) with enhanced diagnostics
      - name: Build Release APK
        run: |
          cd V2rayNG
          ./gradlew assembleRelease --no-daemon --stacktrace --info
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.compiler.execution.strategy=in-process"
      
      # Step 16: Build Release APK (Retry with clean if first attempt fails)
      - name: Build Release APK (Retry with clean)
        if: failure()
        run: |
          cd V2rayNG
          ./gradlew clean assembleRelease --rerun-tasks --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.compiler.execution.strategy=in-process"
      
      # Step 17: Sign APK (arm64-v8a)
      - name: Sign APK (arm64-v8a)
        id: sign_apk_arm64
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: V2rayNG/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
      
      # Step 18: Rename signed APKs with timestamp
      - name: Rename signed APKs
        run: |
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="2.2.9"
          fi
          
          cd V2rayNG/app/build/outputs/apk/release
          
          # Find and rename signed APKs
          for file in *-signed.apk; do
            if [ -f "$file" ]; then
              # Extract ABI from filename
              if [[ $file == *"arm64-v8a"* ]]; then
                ABI="arm64-v8a"
              elif [[ $file == *"armeabi-v7a"* ]]; then
                ABI="armeabi-v7a"
              elif [[ $file == *"x86_64"* ]]; then
                ABI="x86_64"
              elif [[ $file == *"x86"* ]]; then
                ABI="x86"
              else
                ABI="universal"
              fi
              
              NEW_NAME="MikuRay_${VERSION}-${ABI}-release-${BUILD_DATE}.apk"
              mv "$file" "$NEW_NAME"
              echo "Renamed: $file -> $NEW_NAME"
            fi
          done
          
          # List all APKs
          ls -lh *.apk
      
      # Step 19: Upload signed APKs as separate artifacts by architecture
      # arm64-v8a: Modern Android devices (2020+, 64-bit ARM) - ~35 MB
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-arm64-v8a-release
          path: V2rayNG/app/build/outputs/apk/release/*arm64-v8a*-release-*.apk
          if-no-files-found: error
          retention-days: 30
      
      # armeabi-v7a: Older Android devices (32-bit ARM) - ~35 MB
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-armeabi-v7a-release
          path: V2rayNG/app/build/outputs/apk/release/*armeabi-v7a*-release-*.apk
          if-no-files-found: error
          retention-days: 30
      
      # x86_64: Android emulators, Intel/AMD devices (64-bit) - ~75 MB
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-x86_64-release
          path: V2rayNG/app/build/outputs/apk/release/*x86_64*-release-*.apk
          if-no-files-found: error
          retention-days: 30
      
      # x86: Older emulators (32-bit) - ~75 MB
      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-x86-release
          path: V2rayNG/app/build/outputs/apk/release/*x86-release-*.apk
          if-no-files-found: error
          retention-days: 30
      
      # universal: All architectures (largest file) - ~150 MB
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MikuRay-universal-release
          path: V2rayNG/app/build/outputs/apk/release/*universal*-release-*.apk
          if-no-files-found: error
          retention-days: 30
      
      # Step 20: Create build summary
      - name: Create build summary
        run: |
          echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $(grep 'appVersionName' V2rayNG/app/build.gradle.kts | cut -d'"' -f2)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 APK Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cd V2rayNG/app/build/outputs/apk/release
          ls -lh *-release-*.apk 2>/dev/null || echo "No APK files found"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      # Step 21: Create GitHub Release (optional, on tag push)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: V2rayNG/app/build/outputs/apk/release/*-release-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
